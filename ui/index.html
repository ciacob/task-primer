<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: .05em;
      color: #a78bfa;
      margin-bottom: 2rem;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      width: 100%;
      max-width: 540px;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #64748b;
      margin-bottom: 1rem;
    }

    /* State badge */
    #state-badge {
      display: inline-block;
      padding: .3rem .85rem;
      border-radius: 999px;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .04em;
      background: #334155;
      color: #94a3b8;
      margin-bottom: .75rem;
      transition: background .3s, color .3s;
    }
    #state-badge.running  { background: #14532d; color: #4ade80; }
    #state-badge.paused   { background: #713f12; color: #fbbf24; }
    #state-badge.done     { background: #1e3a5f; color: #60a5fa; }
    #state-badge.error    { background: #4c1d1d; color: #f87171; }
    #state-badge.aborted  { background: #3b1f47; color: #c084fc; }

    #status-message {
      font-size: .85rem;
      color: #94a3b8;
      margin-bottom: .75rem;
      min-height: 1.2em;
    }

    /* Progress bar */
    .progress-track {
      background: #2d3148;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-bottom: .5rem;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 999px;
      transition: width .2s ease;
    }
    #progress-label {
      font-size: .75rem;
      color: #64748b;
      text-align: right;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
    }

    button {
      padding: .45rem 1rem;
      border-radius: 7px;
      border: none;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    button:disabled { opacity: .35; cursor: not-allowed; }
    button:not(:disabled):active { transform: scale(.96); }

    .btn-start  { background: #7c3aed; color: #fff; }
    .btn-pause  { background: #d97706; color: #fff; }
    .btn-resume { background: #059669; color: #fff; }
    .btn-abort  { background: #dc2626; color: #fff; }
    .btn-reset  { background: #334155; color: #e2e8f0; }

    /* Log */
    #log {
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: .78rem;
      color: #94a3b8;
      background: #0f1117;
      border-radius: 8px;
      padding: .75rem 1rem;
      height: 180px;
      overflow-y: auto;
      line-height: 1.6;
    }
    #log .entry { border-bottom: 1px solid #1e2130; padding: 2px 0; }
    #log .entry.error { color: #f87171; }
    #log .entry.done  { color: #4ade80; }

    /* Connection dot */
    .conn-row {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .75rem;
      color: #475569;
      margin-top: .5rem;
    }
    #conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #475569;
      transition: background .3s;
    }
    #conn-dot.connected { background: #4ade80; }
  </style>
</head>
<body>

  <h1>⬡ <span class="appName"></span></h1>

  <!-- Status card -->
  <div class="card">
    <h2>Worker Status</h2>
    <div id="state-badge">idle</div>
    <div id="status-message">—</div>
    <div class="progress-track">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-label">—</div>
    <div class="conn-row">
      <div id="conn-dot"></div>
      <span id="conn-label">connecting…</span>
    </div>
  </div>

  <!-- Controls card -->
  <div class="card">
    <h2>Controls</h2>
    <div class="controls">
      <button class="btn-start"  id="btn-start"  disabled>▶ Start task</button>
      <button class="btn-pause"  id="btn-pause"  disabled>⏸ Pause</button>
      <button class="btn-resume" id="btn-resume" disabled>▶ Resume</button>
      <button class="btn-abort"  id="btn-abort"  disabled>⏹ Abort</button>
      <button class="btn-reset"  id="btn-reset"  disabled>↺ Reset</button>
    </div>
  </div>

  <!-- Log card -->
  <div class="card">
    <h2>Event Log</h2>
    <div id="log"></div>
  </div>

  <script src="adapter.js"></script>
  <script src="app.js"></script>
</body>
</html>
